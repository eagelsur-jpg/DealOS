name: DealOS guarded phase2a migration
on:
  push:
    branches: [codex/dealos-production-audit]
    paths: ['.github/workflows/dealos-phase2a.yml']
permissions:
  contents: read
concurrency:
  group: dealos-vps-operations
  cancel-in-progress: false
jobs:
  migration:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate, back up, rehearse, migrate and verify preservation
        run: |
          export PATH="/root/.nvm/versions/node/v22.23.2/bin:$PATH"
          node scripts/ops/migrate-phase2a.mjs
      - name: Post-migration read-only readiness and schema evidence
        run: node scripts/ops/audit-vps.mjs
