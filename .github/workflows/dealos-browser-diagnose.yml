name: DealOS mobile overflow diagnosis
on:
  push:
    branches: [codex/dealos-production-audit]
    paths: ['scripts/ops/browser-diagnose.mjs','.github/workflows/dealos-browser-diagnose.yml']
permissions:
  contents: read
concurrency:
  group: dealos-vps-operations
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node scripts/ops/browser-diagnose.mjs
